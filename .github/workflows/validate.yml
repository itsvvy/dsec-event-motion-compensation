name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m py_compile dsec_mc/*.py scripts/*.py tests/*.py

      - name: Run synthetic motion tests
        run: |
          python -c "from tests.test_synthetic import test_recovers_known_constant_translation as a; a(); print('translation test passed')"
          python -c "from tests.test_blockwise import test_phase_correlation_recovers_content_motion as a, test_blockwise_estimation_recovers_two_motion_regions as b, test_short_baseline_resolves_spurious_zero_long_peak as c; a(); b(); c(); print('blockwise tests passed')"

      - name: Validate notebook JSON
        run: |
          python -m json.tool notebooks/dsec_event_motion_compensation.ipynb > /dev/null
          python -m json.tool notebooks/blockwise_translation.ipynb > /dev/null
